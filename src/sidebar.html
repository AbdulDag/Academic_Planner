<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sidebar</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <main class="ap-sidebar-main">
      <div class="ap-sidebar-body">
        <h1 class="ap-sidebar-title">Academic Planner</h1>
        <p class="ap-sidebar-copy">
          This panel loads inside the extension iframe. Build your planner UI here.
        </p>
        <p class="ap-sidebar-hint">
          Use the edge control or the extension toolbar icon to hide this sidebar.
          Calendar stays in the left two-thirds of the window when the sidebar is open.
        </p>
      </div>

      <div class="ap-sidebar-footer">
        <div class="ap-sidebar-footer-actions">
          <button type="button" class="ap-sidebar-upload">
            Upload files
          </button>
          <button type="button" class="ap-sidebar-upload">
            Enter
          </button>
        </div>
        <textarea
          id="ap-sidebar-notes"
          class="ap-sidebar-textarea"
          rows="5"
          spellcheck="true"
          aria-label="Context for your planner"
          placeholder="Upload your files with due dates and give context. Let us do the rest."
        ></textarea>
      </div>
    </main>
  </body>
</html>
